<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow - Cadastro de Hábitos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Menu Padrão do Grupo -->
  <nav class="navbar">
    <h1>HabitFlow</h1>

    <ul class="nav-links">
      <li><a href="index.html" class="active">Dashboard / Cadastro</a></li>
      <li><a href="registro.html">Registro</a></li>
      <li><a href="hidratacao.html">Hidratação</a></li>
      <li><a href="historico.html">Histórico</a></li>
    </ul>
  </nav>

  <main class="container">
    <section class="card-section">
      <h2>Novo Cadastro Diário</h2>
      <p class="subtitle">Cadastre os seus hábitos para manter sua sequência em dia.</p>

      <!-- Mensagens de Erro e Sucesso -->
      <div id="mensagem-feedback" class="feedback-msg hidden"></div>

      <form id="form-cadastro">
        <div class="form-group">
          <label for="campo-data">Data *</label>
          <input type="date" id="campo-data" required>
        </div>

        <div class="form-group">
          <label for="campo-agua">Água consumida (em ml) *</label>
          <input type="number" id="campo-agua" placeholder="Ex: 2000" min="0" required>
        </div>

        <div class="form-group checkbox-group">
          <label for="campo-exercicio">
            <input type="checkbox" id="campo-exercicio"> Praticou exercício hoje?
          </label>
        </div>

        <div class="form-group">
          <label for="campo-notas">Notas do dia</label>
          <textarea id="campo-notas" placeholder="Ex: Treino de perna, caminhada..." rows="3"></textarea>
        </div>

        <button type="submit" class="btn-primary">Salvar Cadastro</button>
      </form>
    </section>
  </main>

  <!-- Importação dos Scripts JS -->
  <script src="js/dados.js"></script>
  <script src="js/armazenamento.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
